name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obsidian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and manifests
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$(node -p "require('./manifest.json').version")" = "$version"
          node -e "const v=require('./versions.json'); const p=require('./package.json'); if (!v[p.version]) process.exit(1)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Detect a prebuilt release
        id: prebuilt
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            if printf '%s\n' "$assets" | grep -Fxq 'BUILD-INFO.json'; then
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Upload Obsidian release assets
        if: startsWith(github.ref, 'refs/tags/') && steps.prebuilt.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: false
          files: |
            main.js
            manifest.json
            versions.json
            styles.css
